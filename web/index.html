<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lambda nature</title>
<style>
  html, body { margin: 0; height: 100%; background: #13392c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hint {
    position: fixed; left: 12px; bottom: 10px; color: #e6f3c4; opacity: .85;
    font: 12px/1.4 ui-monospace, Menlo, monospace; text-shadow: 0 1px 0 #0b2a20;
    pointer-events: none; transition: opacity 1s;
  }
  #loading {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; justify-items: center; z-index: 10;
    color: #e6f3c4; background: #13392c; font: 12px/1.4 ui-monospace, Menlo, monospace; transition: opacity .5s;
  }
  #loading b { font-size: 14px; letter-spacing: 1px; }
  #loading div { width: min(320px, 70vw); height: 8px; border: 1px solid #e6f3c455; border-radius: 4px; overflow: hidden; }
  #loading i { display: block; height: 100%; width: 0; background: #b8d86a; transition: width .2s; }
  #loading span { opacity: .7; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #fps {
    position: fixed; right: 12px; top: 10px; color: #e6f3c4; opacity: .85;
    font: 12px/1.4 ui-monospace, Menlo, monospace; text-shadow: 0 1px 0 #0b2a20;
    pointer-events: none;
  }
  #admin-button {
    position: fixed; left: 12px; top: 10px; padding: 4px 10px; cursor: pointer;
    color: #e6f3c4; background: #0b2a20cc; border: 1px solid #e6f3c455; border-radius: 4px;
    font: 12px/1.4 ui-monospace, Menlo, monospace;
  }
  #admin-button:hover { background: #134030; }
  #admin {
    position: fixed; left: 12px; top: 40px; bottom: 12px; overflow-y: auto; align-content: start; width: 220px; padding: 10px 12px; display: grid; gap: 10px;
    color: #e6f3c4; background: #0b2a20e6; border: 1px solid #e6f3c455; border-radius: 4px;
    font: 12px/1.4 ui-monospace, Menlo, monospace;
  }
  #admin[hidden] { display: none; }
  #admin label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  #admin input, #admin select { grid-column: 1 / -1; width: 100%; accent-color: #b8d86a; }
  #admin select { font: inherit; color: #e6f3c4; background: #0b2a20; border: 1px solid #e6f3c455; }
  #admin h3 { margin: 4px 0 0; font-size: 12px; color: #b8d86a; }
  #admin .slot { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  #admin .slot button { grid-column: 1 / -1; text-align: left; font: inherit; color: #e6f3c4; background: #0b2a20;
    border: 1px solid #e6f3c455; padding: 2px 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #admin .look { display: grid; gap: 8px; }
  #admin .switch { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #e6f3c455; border-radius: 3px; overflow: hidden; }
  #admin .switch button { font: inherit; color: #e6f3c4; background: #0b2a20; border: 0; padding: 3px 0; cursor: pointer; }
  #admin .switch button.on { color: #0b2a20; background: #b8d86a; }
  #admin .look label.off { opacity: 0.45; }
  #admin .save { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #admin .save button { font: inherit; color: #0b2a20; background: #b8d86a; border: 0; border-radius: 3px; padding: 3px 10px; cursor: pointer; }
  #admin .save button + button { color: #e6f3c4; background: none; border: 1px solid #e6f3c455; }
  #admin .save span { opacity: 0.7; }
  #admin .monsters { display: grid; gap: 8px; }
  #admin .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  #admin .fields label, #admin label.name { grid-template-columns: 1fr; }
  #admin input[type="number"], #admin input[type="text"] { box-sizing: border-box; font: inherit; color: #e6f3c4;
    background: #0b2a20; border: 1px solid #e6f3c455; border-radius: 3px; padding: 2px 5px; }
  #picker {
    position: fixed; left: 256px; top: 40px; bottom: 12px; width: min(480px, calc(100vw - 268px)); overflow-y: auto;
    padding: 0 10px 10px; color: #e6f3c4; background: #0b2a20f2; border: 1px solid #e6f3c455; border-radius: 4px;
    font: 12px/1.4 ui-monospace, Menlo, monospace;
  }
  #picker[hidden] { display: none; }
  #picker header { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; padding: 8px 0; background: #0b2a20; }
  #picker header span { flex: 1; opacity: 0.6; }
  #picker header input { width: 9em; font: inherit; font-size: 12px; color: inherit; background: #ffffff14; border: 1px solid #e6f3c444; border-radius: 4px; padding: 2px 6px; }
  #picker .cell[hidden] { display: none; }
  #picker header button { font: inherit; font-size: 16px; color: inherit; background: none; border: 0; cursor: pointer; }
  #picker .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }
  #picker .cell { display: grid; gap: 3px; justify-items: center; padding: 4px; font: 11px/1.2 ui-monospace, Menlo, monospace;
    color: inherit; background: #ffffff0d; border: 1px solid #e6f3c422; border-radius: 3px; cursor: pointer; }
  #picker .cell:hover { border-color: #e6f3c488; }
  #picker .cell.on { border-color: #b8d86a; background: #b8d86a2a; }
  #picker .cell img { width: 72px; height: 72px; }
  #picker .cell img:not([src]) { visibility: hidden; }
  #picker .cell span { width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #hud { position: fixed; inset: 0; pointer-events: none; font: 11px/1.2 ui-monospace, Menlo, monospace; color: #e6f3c4; }
  #hud .bar { position: relative; height: 5px; background: #0b2a20cc; border: 1px solid #0b2a20; }
  #hud .bar i { position: absolute; inset: 0 auto 0 0; background: #d8564a; }
  #hud .mbar, #hud .float { position: absolute; left: 0; top: 0; }
  #hud .mbar { width: 76px; margin: -20px 0 0 -38px; display: grid; gap: 2px; text-align: center; text-shadow: 0 1px 0 #0b2a20; white-space: nowrap; }
  #hud .float { width: 80px; margin: -10px 0 0 -40px; text-align: center; font-weight: bold; font-size: 14px; color: #fff4c0; text-shadow: 0 1px 0 #0b2a20, 0 0 3px #0b2a20; }
  #hud .float.hurt { color: #ff8a7a; }
  #hud .float.miss { color: #c8d0c0; font-size: 12px; }
  #hud .float.level { color: #b8d86a; font-size: 16px; }
  #hud .me { position: absolute; right: 10px; bottom: 10px; width: 170px; display: grid; gap: 4px; padding: 8px; pointer-events: auto;
    background: #0b2a20dd; border: 1px solid #e6f3c433; border-radius: 4px; }
  #hud .me[hidden] { display: none; }
  #hud .me .bar { height: 12px; }
  #hud .me .bar span { position: relative; display: block; text-align: center; font-size: 10px; line-height: 12px; text-shadow: 0 1px 0 #0b2a20; }
  #hud .me .xp i { background: #b8d86a; }
  #hud .me .stat { display: grid; grid-template-columns: 1fr auto 20px; gap: 6px; align-items: center; }
  #hud .me .stat button { visibility: hidden; font: inherit; line-height: 14px; color: #0b2a20; background: #b8d86a; border: 0; border-radius: 3px; cursor: pointer; }
  #hud .me.spend .stat button { visibility: visible; }
  #hud .me .pts { color: #b8d86a; }
  #hud .me .pts:empty { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">arrows: walk · shift: run · space: jump · click: attack · wheel: zoom · C: clouds</div>
<button id="admin-button">⚙ Admin</button>
<div id="admin" hidden></div>
<div id="picker" hidden></div>
<div id="fps"></div>
<div id="hud"></div>
<div id="loading"><b>Loading</b><div><i></i></div><span>the world</span></div>
<script type="module" src="main.js"></script>
</body>
</html>
